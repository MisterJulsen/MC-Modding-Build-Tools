name: Bug Report
description: Did you find a bug? You can report it here. This template is for bugs only, not crashes.
projects: []
labels:
  - bug
body:
  - type: input
    id: input-0
    attributes:
      label: Minecraft Version
      description: "Details about your game instance, such as the Minecraft version, modloader and modloader version. (Example: `Forge 1.20.1-47.4.10`)"
      placeholder: Forge 1.20.1-47.4.10
    validations:
      required: true
  - type: input
    id: input-1
    attributes:
      label: Mod Version
      description: The mod version which caused the bug.
      placeholder: 3.0.29+mc1.20.1-forge
    validations:
      required: true
  - type: input
    id: input-2
    attributes:
      label: Game Log
      description: Please share your game log for additional information about the bug.
        Usually, this is a file called `latest.log` that can be found in the `logs` folder
        of your Minecraft installation. Please upload the file to https://mclo.gs/ and put
        the link here.
      placeholder: https://mclo.gs/AaBbCcDd
    validations:
      required: true
  - type: textarea
    id: textarea-3
    attributes:
      label: Description
      description: Please describe the bug in as much detail as possible. When did the
        problem occur? What were you doing when the bug happened? What did you
        expect to happen? Please also send screenshots or video clips so we can
        better understand what is going wrong, explain how to
        reproduce the bug and tell what other mods you used.
    validations:
      required: true
  - type: dropdown
    id: dropdown-4
    attributes:
      label: Category
      description: Please specify the category of the bug.
      options:
        - Other/Unknown
        - Gameplay
        - Visual
        - Performance
        - Compatibility
        - Game Breaking
    validations:
      required: true
  - type: markdown
    attributes:
      value: Thanks for taking the time to help improve my mods!
